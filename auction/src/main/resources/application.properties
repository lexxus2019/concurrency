server.port=8080

# Ветка fix/10: брокер Artemis стартует прямо внутри процесса (без Docker и
# без внешнего сервера). concurrency=1 гарантирует, что очередь auction.cmd
# обрабатывает РОВНО ОДИН поток — поэтому состояние в AuctionState можно
# менять без всякой синхронизации.
spring.artemis.mode=embedded
spring.artemis.embedded.queues=auction.cmd
spring.artemis.embedded.persistent=false
spring.artemis.listener.concurrency=1
# HTTP-поток ждёт ответ из очереди; под конкурентной нагрузкой очередь
# может накапливаться, поэтому таймаут щедрый
spring.jms.template.receive-timeout=30000
